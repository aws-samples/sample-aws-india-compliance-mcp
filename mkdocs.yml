site_name: AWS Compliance MCP Server
site_description: Assess AWS infrastructure against regulatory compliance frameworks
site_url: https://aws-samples.github.io/sample-aws-india-compliance-mcp/
repo_url: https://github.com/aws-samples/sample-aws-india-compliance-mcp
repo_name: aws-samples/sample-aws-india-compliance-mcp

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tools Reference: tools.md
  - Frameworks:
    - Overview: frameworks/index.md
    - DPDP Act 2023: frameworks/dpdp.md
    - RBI Master Direction: frameworks/rbi.md
    - SEBI CSCRF: frameworks/sebi.md
    - CERT-In Directions: frameworks/certin.md
  - Architecture: architecture.md
  - Security: security.md
  - Contributing: contributing.md

markdown_extensions:
  - tables
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

plugins:
  - search
