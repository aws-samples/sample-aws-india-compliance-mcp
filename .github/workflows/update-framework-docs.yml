name: Update Framework Docs and README

on:
  push:
    branches: [main]
    paths:
      - "src/aws_india_compliance/frameworks/*.yaml"

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Rebuild control_mappings.json
        run: python scripts/build_manifest.py

      - name: Regenerate framework documentation
        run: python scripts/generate_framework_docs.py

      - name: Update README frameworks list
        run: python scripts/update_readme_frameworks.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updates
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ README.md mkdocs.yml src/aws_india_compliance/control_mappings.json
          git commit -m "chore: auto-update framework docs, README, and manifest [skip ci]"
          git push
