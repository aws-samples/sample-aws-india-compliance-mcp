name: Regulatory Update Reminder

on:
  schedule:
    # Run on 1st and 26th of each month (~25 day cadence)
    - cron: '0 9 1,26 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check last_verified dates
        id: check
        run: |
          python3 -c "
          import json, sys
          from datetime import datetime, timedelta

          with open('src/aws_india_compliance/control_mappings.json') as f:
              manifest = json.load(f)

          threshold = 30
          today = datetime.now()
          stale = []

          for fw_key, fw_data in manifest.get('frameworks', {}).items():
              last = fw_data.get('last_verified', '')
              if last:
                  verified = datetime.fromisoformat(last)
                  days = (today - verified).days
                  if days > threshold:
                      stale.append(f'{fw_data.get(\"name\", fw_key)}: {days} days since last verified')

          if stale:
              print('ACTION_NEEDED=true')
              findings = '\n'.join(f'- {s}' for s in stale)
              print(f'FINDINGS<<EOF\n{findings}\nEOF')
          else:
              print('ACTION_NEEDED=false')
              print('FINDINGS=All frameworks verified within 30 days.')
          " >> "$GITHUB_OUTPUT"

      - name: Create reminder issue if stale
        if: steps.check.outputs.ACTION_NEEDED == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const findings = `${{ steps.check.outputs.FINDINGS }}`;

            const body = `## Regulatory Mapping Review Reminder

            One or more framework mappings haven't been verified in 30+ days:

            ${findings}

            ### What to do
            1. Check your Google Alerts inbox for any new circulars from RBI/SEBI/MeitY
            2. If nothing new: bump \`last_verified\` dates in \`control_mappings.json\` and push
            3. If new circular found: use \`aws-india-compliance-admin propose\` + \`apply\` workflow
            4. Publish new PyPI version

            _Auto-generated by regulatory-check workflow._
            `.replace(/^            /gm, '');

            // Check for existing open issue
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'regulatory-update',
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Regulatory mapping review due',
                body: body,
                labels: ['regulatory-update', 'maintenance'],
              });
            }
