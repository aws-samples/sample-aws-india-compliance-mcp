# Digital Personal Data Protection Act 2023 + Rules 2025
# Source: https://www.meity.gov.in/data-protection-framework
# Last updated: 2026-07-30

id: dpdp
name: "Digital Personal Data Protection Act 2023 + Rules 2025"
version: "Act 2023 + Rules notified November 14, 2025"
source_url: "https://www.meity.gov.in/data-protection-framework"
last_verified: "2026-07-30"

source_domains:
  - "meity.gov.in"
  - "egazette.gov.in"

activation: always
activation_param: ""

search_sources:
  - "https://www.meity.gov.in/data-protection-framework"

circular_sources: []

keywords:
  - "data protection"
  - "personal data"
  - "dpdp"
  - "privacy"
  - "consent"
  - "data principal"
  - "data fiduciary"
  - "breach notification"

penalty_default: "Up to INR 50 Crore"
penalty_overrides:
  9: "Up to INR 200 Crore"
  10: "Up to INR 150 Crore"

config_rule_params:
  CW_LOGGROUP_RETENTION_PERIOD_CHECK:
    MinRetentionTime: "365"

domains:
  1:
    name: "Lawful Processing and Consent Management"
    section: "Act Sections 4-6, Rules 4"
    type: organizational
    aws_controls:
      - "Amazon Cognito consent tracking"
      - "Custom consent management via DynamoDB/S3"
      - "Consent Manager integration via API Gateway"
      - "DynamoDB for 7-year consent record retention"
    config_rules: []
    guardrails: []
    notes: >
      Rule 4 introduces Consent Manager framework: must be India-incorporated,
      INR 2Cr net worth, interoperable platform, 7-year consent record retention,
      no subcontracting. Registration with DPB required by Nov 2026.

  2:
    name: "Data Minimization"
    section: "Act Section 4(2)"
    type: organizational
    aws_controls:
      - "S3 lifecycle policies"
      - "DynamoDB TTL"
      - "Data retention automation"
    config_rules: []
    guardrails: []

  3:
    name: "Privacy Notices"
    section: "Act Section 5, Rule 3"
    type: organizational
    aws_controls:
      - "API Gateway for consent withdrawal endpoints"
      - "Lambda for automated rights exercise"
    config_rules: []
    guardrails: []
    notes: >
      Rule 3 mandates standalone notices with: itemized list of personal data
      collected, specific processing purposes, direct links for consent withdrawal,
      rights exercise, and complaint filing. Effective May 2027.

  4:
    name: "Data Principal Rights"
    section: "Act Sections 11-14, Rules 5, 9"
    type: organizational
    aws_controls:
      - "API Gateway for data subject requests"
      - "Lambda for automated responses"
      - "S3 for data portability exports"
      - "Step Functions for rights request workflows"
    config_rules: []
    guardrails: []
    notes: >
      Rules require specific mechanisms for Data Principals to withdraw consent,
      exercise rights, and file complaints. Must provide website link or app process.

  5:
    name: "Breach Notification"
    section: "DPDP Act Section 8(5), Rules 2025 Rule 7 (7.1.a-e: breach nature, risks, affected categories, mitigation measures, contact details)"
    type: technical
    aws_controls:
      - "GuardDuty"
      - "Security Hub"
      - "CloudTrail"
      - "EventBridge for automated alerting"
      - "SNS for dual notification (DPB + Data Principals)"
      - "Lambda for automated breach report generation"
    config_rules:
      - "guardduty-enabled-centralized"
      - "securityhub-enabled"
      - "cloud-trail-cloud-watch-logs-enabled"
      - "cloudtrail-enabled"
      - "cloud-trail-log-file-validation-enabled"
      - "cloudwatch-log-group-encrypted"
    guardrails:
      - "AWS-GR_CLOUDTRAIL_ENABLED"
      - "AWS-GR_CLOUDTRAIL_VALIDATION_ENABLED"
      - "AWS-GR_AUDIT_BUCKET_LOGGING_ENABLED"
      - "AWS-GR_LOG_GROUP_ENCRYPTED"
    notes: >
      Rule 7 is stricter than the Act alone: NO threshold for breach reporting
      (any breach must be reported). Dual notification required: (1) immediate
      notice to affected Data Principals with breach details, consequences,
      mitigation steps; (2) immediate intimation to DPB + detailed report within
      72 hours. Penalties up to INR 200 crores.

  6:
    name: "Reasonable Security Safeguards"
    section: "DPDP Act Section 8(4), Rules 2025 Rule 6 (6.1.a-g: unauthorized access prevention, confidentiality, integrity, encryption, anonymization, access controls, monitoring)"
    type: technical
    aws_controls:
      - "KMS encryption"
      - "S3 Block Public Access"
      - "IAM least privilege"
      - "VPC network isolation"
      - "WAF"
      - "Shield"
      - "CloudWatch Logs with 1-year retention for access logs"
      - "AWS Backup for continuity measures"
      - "Macie for data masking and classification"
    config_rules:
      - "encrypted-volumes"
      - "rds-storage-encrypted"
      - "s3-bucket-server-side-encryption-enabled"
      - "s3-bucket-ssl-requests-only"
      - "s3-bucket-public-read-prohibited"
      - "s3-bucket-public-write-prohibited"
      - "s3-account-level-public-access-blocks-periodic"
      - "rds-instance-public-access-check"
      - "ec2-instance-no-public-ip"
      - "lambda-function-public-access-prohibited"
      - "eks-secrets-encrypted"
      - "eks-endpoint-no-public-access"
      - "elasticsearch-encrypted-at-rest"
      - "sns-encrypted-kms"
      - "redshift-cluster-configuration-check"
      - "cloud-trail-encryption-enabled"
      - "cmk-backing-key-rotation-enabled"
      - "ec2-imdsv2-check"
      - "iam-policy-no-statements-with-admin-access"
      - "iam-root-access-key-check"
      - "mfa-enabled-for-iam-console-access"
      - "root-account-mfa-enabled"
      - "secretsmanager-rotation-enabled-check"
      - "restricted-ssh"
      - "vpc-flow-logs-enabled"
      - "cw-loggroup-retention-period-check"
      - "s3-bucket-logging-enabled"
    guardrails:
      - "AWS-GR_ENCRYPTED_VOLUMES"
      - "AWS-GR_RDS_STORAGE_ENCRYPTED"
      - "AWS-GR_S3_BUCKET_PUBLIC_READ_PROHIBITED"
      - "AWS-GR_S3_BUCKET_PUBLIC_WRITE_PROHIBITED"
      - "AWS-GR_RESTRICT_ROOT_USER"
      - "AWS-GR_MFA_ENABLED_FOR_IAM_CONSOLE_ACCESS"
      - "AWS-GR_EC2_INSTANCE_NO_PUBLIC_IP"
      - "AWS-GR_LAMBDA_FUNCTION_PUBLIC_ACCESS_PROHIBITED"
      - "AWS-GR_AUDIT_BUCKET_ENCRYPTION_ENABLED"
      - "AWS-GR_S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC"
    notes: >
      Rule 6 makes safeguards PRESCRIPTIVE (not just reasonable): mandatory
      encryption, masking, obfuscation, tokenization. Mandatory access controls,
      activity logs, continuity measures (backups). ONE-YEAR mandatory retention
      of unauthorized access logs. Data Processor agreements must include mandatory
      security clauses. These are minimum standards.

  7:
    name: "Data Retention Limits"
    section: "Act Section 8(6), Rule 8"
    type: technical
    aws_controls:
      - "S3 lifecycle policies"
      - "DynamoDB TTL"
      - "Backup retention policies"
      - "S3 Object Lock for mandatory log retention"
      - "EventBridge + Lambda for 48-hour erasure warnings"
      - "CloudWatch Logs 1-year minimum retention"
    config_rules:
      - "s3-lifecycle-policy-check"
      - "dynamodb-table-encrypted-kms"
      - "dynamodb-pitr-enabled"
      - "s3-bucket-versioning-enabled"
      - "db-instance-backup-enabled"
      - "cw-loggroup-retention-period-check"
    guardrails:
      - "AWS-GR_AUDIT_BUCKET_RETENTION_POLICY"
    notes: >
      Rule 8 adds prescriptive requirements: erasure when user disengages
      (per Third Schedule categories), 48-hour warning before erasure, 1-year
      minimum log retention. Large-scale Data Fiduciaries (e-commerce 20M+,
      gaming 5M+, social media 20M+ Indian users) must erase after 3 years
      except for account access or legal compliance.

  8:
    name: "Cross-Border Data Transfer"
    section: "Act Sections 16-17, Rules 14-15"
    type: organizational
    aws_controls:
      - "Region deny SCPs"
      - "S3 replication controls"
    config_rules:
      - "ebs-snapshot-public-restorable-check"
      - "rds-snapshots-public-prohibited"
    guardrails:
      - "AWS-GR_REGION_DENY"
      - "AWS-GR_DISALLOW_CROSS_REGION_NETWORKING"
    notes: >
      Rules adopt blacklist approach (more lenient than GDPR): data may generally
      be transferred outside India. Restrictions only for government-designated
      blacklisted countries/entities. No blacklist published yet as of April 2026.
      SDFs may face additional data localization requirements per Rule 13.

  9:
    name: "Children's Data Protection"
    section: "Act Section 9, Rules 10-12"
    type: organizational
    aws_controls:
      - "Age verification via Cognito"
      - "Parental consent workflows"
      - "Virtual identity token verification"
      - "Step Functions for parental consent orchestration"
    config_rules: []
    guardrails: []
    notes: >
      Rules 10-12 require verifiable parental consent using: identity data,
      voluntarily provided details, or authorized virtual identity tokens.
      Schools, healthcare, and childcare services get targeted exemptions.
      Age threshold is 18 (not 16 as in GDPR).

  10:
    name: "Significant Data Fiduciary Obligations"
    section: "Act Section 10, Rule 13"
    type: organizational
    aws_controls:
      - "Audit Manager for annual DPIA"
      - "AWS Config for continuous compliance"
      - "SageMaker model monitoring for algorithmic assessments"
      - "Inspector for independent security audits"
    config_rules: []
    guardrails: []
    notes: >
      Rule 13 makes obligations prescriptive: mandatory annual DPIAs and
      independent audits. Algorithmic assessments required, must ensure technical
      measures (including algorithmic software) do not pose risk to Data Principal
      rights. Data localization for government-notified categories. Must submit
      reports to DPB. No SDFs designated yet as of April 2026.

# Declarative assessment checks.
# These define resource-level and architecture-level compliance checks.
# The generic rule evaluator in assessment.py processes these alongside
# the existing Python check functions (which handle complex conditional logic).

checks:
  # Resource-level checks: run per matching component
  - match: "S3::Bucket"
    property: "encryption"
    expect: "encrypted"
    domain: 6
    risk: high
    gap: "S3 bucket lacks encryption at rest"
    remediation: "Enable SSE-KMS or SSE-S3 encryption"
    reference: "DPDP Act Section 8(4), Rule 6.1.d"
    confidence: high

  - match: "S3::Bucket"
    property: "public_access_blocked"
    expect: true
    domain: 6
    risk: high
    gap: "S3 public access not fully blocked"
    remediation: "Enable S3 Block Public Access (all 4 settings)"
    reference: "DPDP Act Section 8(4), Rule 6.1.a"
    confidence: high

  - match: "S3::Bucket"
    property: "lifecycle_policy"
    expect: true
    domain: 7
    risk: medium
    gap: "S3 bucket lacks lifecycle or retention policy"
    remediation: "Add lifecycle rules for data retention"
    reference: "DPDP Act Section 8(6), Rule 8"
    confidence: high

  - match: "RDS::DB"
    property: "encryption"
    expect: "encrypted"
    domain: 6
    risk: high
    gap: "RDS instance not encrypted at rest"
    remediation: "Enable RDS storage encryption"
    reference: "DPDP Act Section 8(4), Rule 6.1.d"
    confidence: high

  - match: "RDS::DB"
    property: "public"
    expect: false
    domain: 6
    risk: critical
    gap: "RDS instance is publicly accessible"
    remediation: "Disable public accessibility on the RDS instance"
    reference: "DPDP Act Section 8(4), Rule 6.1.a"
    confidence: high

  - match: "DynamoDB::Table"
    property: "encryption"
    expect: "encrypted"
    domain: 6
    risk: high
    gap: "DynamoDB table not encrypted with KMS"
    remediation: "Enable KMS encryption on the table"
    reference: "DPDP Act Section 8(4), Rule 6.1.d"
    confidence: high

  - match: "EC2::Instance"
    property: "public_ip"
    expect: false
    domain: 6
    risk: high
    gap: "EC2 instance has a public IP address"
    remediation: "Remove public IP or move to private subnet"
    reference: "DPDP Act Section 8(4), Rule 6.1.a"
    confidence: high

  - match: "EC2::Instance"
    property: "imdsv2_required"
    expect: true
    domain: 6
    risk: high
    gap: "EC2 instance does not enforce IMDSv2"
    remediation: "Set HttpTokens=required in instance metadata options"
    reference: "DPDP Act Section 8(4), Rule 6.1.a"
    confidence: high

  - match: "Lambda::Function"
    property: "public"
    expect: false
    domain: 6
    risk: high
    gap: "Lambda function has public access"
    remediation: "Remove resource-based policy that allows public invocation"
    reference: "DPDP Act Section 8(4), Rule 6.1.a"
    confidence: high

  - match: "EKS::Cluster"
    property: "secrets_encrypted"
    expect: true
    domain: 6
    risk: high
    gap: "EKS cluster secrets not encrypted"
    remediation: "Enable KMS envelope encryption for Kubernetes secrets"
    reference: "DPDP Act Section 8(4), Rule 6.1.d"
    confidence: high

  - match: "EKS::Cluster"
    property: "endpoint_public"
    expect: false
    domain: 6
    risk: high
    gap: "EKS cluster API endpoint is publicly accessible"
    remediation: "Restrict API endpoint to private access"
    reference: "DPDP Act Section 8(4), Rule 6.1.a"
    confidence: high

  - match: "CloudTrail::Trail"
    property: "log_file_validation"
    expect: true
    domain: 5
    risk: high
    gap: "CloudTrail log file validation is disabled"
    remediation: "Enable log file validation for tamper detection"
    reference: "DPDP Act Section 8(5), Rule 7"
    confidence: high

  - match: "Logs::LogGroup"
    property: "retention_days"
    expect_min: 365
    domain: 7
    risk: medium
    gap: "CloudWatch log group retention is less than 1 year"
    remediation: "Set retention to at least 365 days per Rule 6 requirements"
    reference: "DPDP Act Section 8(4), Rule 6.1.g"
    confidence: high

  # Architecture-level checks: run once across all components
  - match_any: "guardduty"
    domain: 5
    risk: critical
    gap: "No GuardDuty enabled for breach detection"
    remediation: "Enable Amazon GuardDuty"
    reference: "DPDP Act Section 8(5)"
    confidence: high

  - match_any: "securityhub"
    domain: 5
    risk: critical
    gap: "No Security Hub for centralized security findings"
    remediation: "Enable AWS Security Hub"
    reference: "DPDP Act Section 8(5)"
    confidence: high

  - match_any: "kms"
    domain: 6
    risk: high
    gap: "No KMS keys found for encryption key management"
    remediation: "Create and use KMS keys for encryption"
    reference: "DPDP Act Section 8(4), Rule 6.1.d"
    confidence: high
