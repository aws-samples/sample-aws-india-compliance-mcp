# RBI Master Direction on IT Governance, Risk, Controls and Assurance Practices
# Source: https://rbi.org.in/Scripts/BS_ViewMasterDirections.aspx
# Last updated: 2026-06-30

id: rbi
name: "RBI Master Direction on IT Governance, Risk, Controls and Assurance Practices"
version: "DoS.CO.CSITE.SEC.3/31.01.015/2023-24 (April 7, 2023)"
source_url: "https://rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"
last_verified: "2026-06-30"

source_domains:
  - "rbi.org.in"

activation: opt_in
activation_param: "is_rbi_regulated"

search_sources:
  - "https://rbi.org.in/Scripts/BS_ViewMasterDirections.aspx"

circular_sources:
  - "https://rbi.org.in/Scripts/BS_CircularIndexDisplay.aspx"

keywords:
  - "it governance"
  - "cyber security"
  - "information security"
  - "it risk"
  - "outsourcing"
  - "cloud"
  - "data localization"
  - "digital payment"
  - "master direction"
  - "csite"
  - "information technology"

penalty_default: "As per RBI enforcement framework"

config_rule_params:
  CW_LOGGROUP_RETENTION_PERIOD_CHECK:
    MinRetentionTime: "180"

domains:
  1:
    name: "IT Governance and Oversight"
    section: "Chapter I"
    type: organizational
    aws_controls:
      - "AWS Organizations"
      - "Control Tower"
      - "Service Catalog"
    config_rules: []
    guardrails: []

  2:
    name: "IT Infrastructure and Service Management"
    section: "Chapter II"
    type: technical
    aws_controls:
      - "Systems Manager"
      - "CloudWatch"
      - "Auto Scaling"
      - "Lambda DLQ"
    config_rules:
      - "ec2-instance-managed-by-systems-manager"
      - "ec2-stopped-instance"
      - "ec2-volume-inuse-check"
    guardrails:
      - "AWS-GR_EBS_OPTIMIZED_INSTANCE"

  3:
    name: "IT Risk Management"
    section: "Chapter III"
    type: organizational
    aws_controls:
      - "AWS Config"
      - "Security Hub"
      - "Inspector"
      - "Audit Manager"
    config_rules: []
    guardrails: []

  4:
    name: "Information Security"
    section: "Chapter IV"
    type: technical
    aws_controls:
      - "KMS"
      - "IAM"
      - "S3 Block Public Access"
      - "RDS encryption"
      - "EBS encryption"
    config_rules:
      - "access-keys-rotated"
      - "iam-password-policy"
      - "iam-policy-no-statements-with-admin-access"
      - "iam-root-access-key-check"
      - "iam-user-mfa-enabled"
      - "encrypted-volumes"
      - "rds-storage-encrypted"
      - "s3-bucket-server-side-encryption-enabled"
      - "s3-bucket-public-read-prohibited"
      - "kms-cmk-not-scheduled-for-deletion"
    guardrails:
      - "AWS-GR_ENCRYPTED_VOLUMES"
      - "AWS-GR_RDS_STORAGE_ENCRYPTED"
      - "AWS-GR_S3_BUCKET_PUBLIC_READ_PROHIBITED"
      - "AWS-GR_RESTRICT_ROOT_USER"
      - "AWS-GR_MFA_ENABLED_FOR_IAM_CONSOLE_ACCESS"
      - "AWS-GR_EBS_SNAPSHOT_PUBLIC_RESTORABLE_CHECK"

  5:
    name: "Cyber Security"
    section: "Chapter V"
    type: technical
    aws_controls:
      - "GuardDuty"
      - "WAF"
      - "Shield"
      - "Network Firewall"
      - "VPC Flow Logs"
    config_rules:
      - "guardduty-enabled-centralized"
      - "vpc-flow-logs-enabled"
      - "restricted-ssh"
      - "ec2-instances-in-vpc"
    guardrails:
      - "AWS-GR_EC2_INSTANCE_NO_PUBLIC_IP"
      - "AWS-GR_LAMBDA_FUNCTION_PUBLIC_ACCESS_PROHIBITED"
      - "AWS-GR_SUBNET_AUTO_ASSIGN_PUBLIC_IP_DISABLED"

  6:
    name: "Business Continuity and Disaster Recovery"
    section: "Chapter VI"
    type: technical
    aws_controls:
      - "AWS Backup"
      - "S3 versioning"
      - "RDS Multi-AZ"
      - "DynamoDB PITR"
      - "Cross-region replication"
    config_rules:
      - "db-instance-backup-enabled"
      - "dynamodb-pitr-enabled"
      - "s3-bucket-versioning-enabled"
      - "rds-multi-az-support"
    guardrails: []

  7:
    name: "Information Systems Audit"
    section: "Chapter VII"
    type: technical
    aws_controls:
      - "CloudTrail"
      - "CloudWatch Logs"
      - "S3 access logging"
      - "Audit Manager"
    config_rules:
      - "cloudtrail-enabled"
      - "cloud-trail-log-file-validation-enabled"
      - "cloud-trail-encryption-enabled"
      - "cloudwatch-log-group-encrypted"
      - "s3-bucket-logging-enabled"
    guardrails:
      - "AWS-GR_CLOUDTRAIL_ENABLED"
      - "AWS-GR_CLOUDTRAIL_VALIDATION_ENABLED"
      - "AWS-GR_AUDIT_BUCKET_LOGGING_ENABLED"
      - "AWS-GR_LOG_GROUP_ENCRYPTED"

# Declarative assessment checks for RBI Master Direction.

checks:
  # Resource-level checks
  - match: "S3::Bucket"
    property: "encryption"
    expect: "encrypted"
    domain: 4
    risk: high
    gap: "S3 bucket lacks encryption at rest"
    remediation: "Enable SSE-KMS or SSE-S3 encryption"
    reference: "RBI MD Chapter IV"
    confidence: high

  - match: "S3::Bucket"
    property: "public_access_blocked"
    expect: true
    domain: 4
    risk: high
    gap: "S3 public access not blocked"
    remediation: "Enable S3 Block Public Access"
    reference: "RBI MD Chapter IV"
    confidence: high

  - match: "S3::Bucket"
    property: "versioning"
    expect: true
    domain: 6
    risk: medium
    gap: "S3 bucket lacks versioning for data recovery"
    remediation: "Enable versioning"
    reference: "RBI MD Chapter VI"
    confidence: high

  - match: "S3::Bucket"
    property: "access_logging"
    expect: true
    domain: 7
    risk: medium
    gap: "S3 bucket lacks access logging"
    remediation: "Enable server access logging"
    reference: "RBI MD Chapter VII"
    confidence: high

  - match: "RDS::DB"
    property: "encryption"
    expect: "encrypted"
    domain: 4
    risk: high
    gap: "RDS instance not encrypted at rest"
    remediation: "Enable RDS storage encryption"
    reference: "RBI MD Chapter IV"
    confidence: high

  - match: "RDS::DB"
    property: "public"
    expect: false
    domain: 4
    risk: critical
    gap: "RDS instance is publicly accessible"
    remediation: "Disable public accessibility"
    reference: "RBI MD Chapter IV, V"
    confidence: high

  - match: "RDS::DB"
    property: "multi_az"
    expect: true
    domain: 6
    risk: medium
    gap: "RDS instance not configured for Multi-AZ"
    remediation: "Enable Multi-AZ deployment for high availability"
    reference: "RBI MD Chapter VI"
    confidence: high

  - match: "EC2::Instance"
    property: "public_ip"
    expect: false
    domain: 5
    risk: high
    gap: "EC2 instance has a public IP address"
    remediation: "Remove public IP or move to private subnet"
    reference: "RBI MD Chapter V"
    confidence: high

  - match: "EC2::Instance"
    property: "imdsv2_required"
    expect: true
    domain: 4
    risk: high
    gap: "EC2 instance does not enforce IMDSv2"
    remediation: "Set HttpTokens=required in instance metadata options"
    reference: "RBI MD Chapter IV"
    confidence: high

  - match: "DynamoDB::Table"
    property: "encryption"
    expect: "encrypted"
    domain: 4
    risk: high
    gap: "DynamoDB table not encrypted with KMS"
    remediation: "Enable KMS encryption on the table"
    reference: "RBI MD Chapter IV"
    confidence: high

  - match: "DynamoDB::Table"
    property: "pitr"
    expect: true
    domain: 6
    risk: medium
    gap: "DynamoDB table lacks point-in-time recovery"
    remediation: "Enable PITR for disaster recovery"
    reference: "RBI MD Chapter VI"
    confidence: high

  - match: "CloudTrail::Trail"
    property: "log_file_validation"
    expect: true
    domain: 7
    risk: high
    gap: "CloudTrail log file validation is disabled"
    remediation: "Enable log file validation for tamper detection"
    reference: "RBI MD Chapter VII"
    confidence: high

  - match: "Logs::LogGroup"
    property: "retention_days"
    expect_min: 180
    domain: 7
    risk: medium
    gap: "CloudWatch log group retention is less than 180 days"
    remediation: "Set retention to at least 180 days per CERT-In requirement"
    reference: "RBI MD Chapter VII, CERT-In Direction 4"
    confidence: high

  # Architecture-level checks
  - match_any: "guardduty"
    domain: 5
    risk: critical
    gap: "No GuardDuty enabled for cyber threat detection"
    remediation: "Enable Amazon GuardDuty"
    reference: "RBI MD Chapter V"
    confidence: high

  - match_any: "cloudtrail"
    domain: 7
    risk: critical
    gap: "No CloudTrail for audit logging"
    remediation: "Enable CloudTrail in all regions"
    reference: "RBI MD Chapter VII"
    confidence: high

  - match_any: "waf"
    domain: 5
    risk: high
    gap: "No WAF for web application protection"
    remediation: "Deploy AWS WAF on public-facing endpoints"
    reference: "RBI MD Chapter V"
    confidence: high
